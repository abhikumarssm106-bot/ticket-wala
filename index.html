<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#10233F" />

    <!-- SEO Meta Tags -->
    <title>TicketWala – Personal Ticket Booking Assistant (Bus, Train, Flight & Movie)</title>
    <meta
      name="description"
      content="Personal ticket booking assistance across India. Real human coordination for train, bus, flight, and movie tickets. Fast response on WhatsApp."
    />
    <meta
      name="keywords"
      content="Ticket booking assistance, train ticket helper, tatkal assistance, flight booking support, bus tickets India, movie ticket concierge, TicketWala"
    />
    <link rel="canonical" href="https://ticketwala.in/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ticketwala.in/" />
    <meta
      property="og:title"
      content="TicketWala – Personal Ticket Booking Assistant"
    />
    <meta
      property="og:description"
      content="Personal ticket booking assistance across India. Real human coordination for train, bus, flight, and movie tickets."
    />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="TicketWala – Personal Ticket Booking Assistant"
    />
    <meta
      name="twitter:description"
      content="Personal ticket booking assistance across India. Real human coordination for train, bus, flight, and movie tickets."
    />

    <!-- Google Fonts: Manrope (headings) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "TicketWala",
        "description": "Personal ticket booking assistance across India for train, bus, flight, and movie tickets.",
        "telephone": "+91 98765 43210",
        "email": "hello@ticketwala.in",
        "priceRange": "₹₹",
        "openingHours": "Mo-Su 09:00-22:00",
        "areaServed": {
          "@type": "Country",
          "name": "India"
        },
        "serviceArea": "India",
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Ticket Booking Concierge Services",
          "itemListElement": [
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Train Ticket Booking Assistance"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Bus Ticket Booking Assistance"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Flight Ticket Booking Assistance"
              }
            },
            {
              "@type": "Offer",
              "itemOffered": {
                "@type": "Service",
                "name": "Movie Ticket Booking Assistance"
              }
            }
          ]
        }
      }
    </script>
  </head>
  <body class="bg-[#F5F7FA] text-[#191C1E] antialiased selection:bg-[#D7E2FF] selection:text-[#001A40]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
